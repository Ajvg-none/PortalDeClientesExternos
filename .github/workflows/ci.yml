name: CI

on:
  push:
    branches: [main, rama-alejandro]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Servicio PostgreSQL 16 para tests de integración (hallazgo A.3).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: portal_test
          POSTGRES_DB: portal_test
        options: >-
          --health-cmd "pg_isready -U portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://portal_test:portal_test@localhost:5432/portal_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: node scripts/check-structure.mjs

      - name: Backend lint
        working-directory: backend
        run: npm ci && npm run lint

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck && npm run typecheck:tests

      - name: Backend unit tests
        working-directory: backend
        run: npm test

      - name: Prisma generate (required for integration tests)
        working-directory: backend
        run: npx prisma generate

      - name: Backend integration tests
        working-directory: backend
        run: npm run test:integration

      - name: Frontend lint
        working-directory: frontend
        run: npm ci && npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  images:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend prod image
        working-directory: backend
        run: docker build --target prod -t portal-api-prod .

      - name: Build frontend prod image
        working-directory: frontend
        run: docker build --target prod -t portal-frontend-prod .

      - name: Smoke test
        run: |
          docker compose -f infra/docker-compose.staging.yml up -d --build --wait
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1
          docker compose -f infra/docker-compose.staging.yml down