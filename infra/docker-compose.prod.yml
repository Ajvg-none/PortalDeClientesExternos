# ============================================================
# docker-compose - ENTORNO DE PRODUCCION (ARQ-2, anexo v1.2)
# Orquesta db (PostgreSQL 16), api (Node 20), frontend (Nginx
# estatico) y cloudflared (tunel Cloudflare). Sin puertos
# publicos: cloudflared hace outbound connection a Cloudflare.
# Uso: docker compose -f infra/docker-compose.prod.yml up -d
# Secretos via .env.prod (fuera del repo)
# ============================================================

name: portal-clientes-externos-prod

services:
  db:
    image: postgres:16-alpine
    container_name: portal-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: ../backend
      target: prod
    container_name: portal-api-prod
    # Ejecutar migraciones Prisma antes de levantar la API (hallazgo A.4).
    # Fase 8 arrancaba con esquema vacío sin esto.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portal}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      target: prod
    container_name: portal-frontend-prod
    restart: unless-stopped
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portal-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge